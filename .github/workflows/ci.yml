name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      # Headless runners have no GPU. Mesa's lavapipe is a software Vulkan device,
      # so the adapter/device specs (not just the ABI-size checks) can run in CI.
      - name: Install a software Vulkan adapter (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1

      # link.cr is generated (gitignored); the native lib must be present to link
      # against. Pin the same wgpu-native version the committed bindings + ABI specs
      # target, so a newer upstream release can't silently shift struct sizes.
      - name: Fetch wgpu-native (pinned) and generate link flags
        # No version argument: the script installs its DEFAULT_VERSION, the one the
        # committed bindings (src/wgpu/native.cr) were generated from. Single source
        # of truth, so the CI pin cannot drift from the bindings again.
        run: ./scripts/download_wgpu.sh

      - name: Run specs
        run: crystal spec
